<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Akun Mahasiswa - Teras JTI</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components/button.css" />
    <link rel="stylesheet" href="assets/css/components/card.css" />
    <link rel="stylesheet" href="assets/css/components/form.css" />
    <link rel="stylesheet" href="assets/css/components/status.css" />
    <link rel="stylesheet" href="assets/css/components/table.css" />
  </head>
  <body class="login-body">
    <div class="login-wrapper">
      <!-- Kolom Kiri -->
      <aside class="login-brand">
        <div class="login-brand-inner">
          <div class="login-logo-box">
            <img
              src="assets/images/logo.png"
              alt="Logo Teras JTI"
              class="login-logo-img"
            />
          </div>
          <h1 class="login-brand-title">Daftar Akun Teras JTI</h1>
          <p class="login-brand-desc">
            Buat akun mahasiswa untuk mulai memesan ruang diskusi dan fasilitas akademik secara mandiri.
          </p>
          <div class="mt-4">
            <a href="index.html" class="text-white text-decoration-none fw-medium">
              &larr; Kembali ke Profil Utama
            </a>
          </div>
        </div>
      </aside>

      <!-- Kolom Kanan -->
      <main class="login-panel">
        <div class="login-box" style="max-width: 440px;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="login-heading m-0">Buat Akun Baru</h2>
            <a href="login.html" class="text-muted text-decoration-none small">Sudah Punya Akun?</a>
          </div>

          <form id="form-registrasi" action="dashboard.html" method="get">
            <div class="form-group mb-3">
              <label for="nama" class="form-label">Nama Lengkap Mahasiswa</label>
              <input
                type="text"
                id="nama"
                name="nama"
                class="form-input"
                placeholder="Contoh: Farrel Ananta"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label for="nim" class="form-label">NIM (Nomor Induk Mahasiswa)</label>
              <input
                type="text"
                id="nim"
                name="nim"
                class="form-input"
                placeholder="Contoh: E41240001"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label for="email" class="form-label">Email Student Polije</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="nama@student.polije.ac.id"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label for="sandi" class="form-label">Kata Sandi</label>
              <input
                type="password"
                id="sandi"
                name="sandi"
                class="form-input"
                placeholder="Minimal 6 karakter"
                required
              />
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="setuju" required checked />
              <label class="form-check-label small text-muted" for="setuju">
                Saya menyetujui tata tertib penggunaan fasilitas Teras JTI Polije.
              </label>
            </div>

            <button type="submit" class="btn-login">Daftar &amp; Masuk ke Sistem</button>
          </form>

          <p class="login-footer-text">
            Sudah memiliki akun?
            <a href="login.html" class="login-link">Masuk Sekarang</a>
          </p>

          <div class="text-center mt-3">
            <small class="text-muted">Workshop Desain Aplikasi &middot; Kelompok 4 NoBugNoCry 2026</small>
          </div>
        </div>
      </main>
    </div>

    <!-- Bootstrap 5 JS & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
