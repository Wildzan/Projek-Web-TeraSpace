<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Teras JTI</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS (Loaded after Bootstrap to preserve brand styling) -->
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components/button.css" />
    <link rel="stylesheet" href="assets/css/components/card.css" />
    <link rel="stylesheet" href="assets/css/components/form.css" />
    <link rel="stylesheet" href="assets/css/components/status.css" />
    <link rel="stylesheet" href="assets/css/components/table.css" />
  </head>
  <body class="login-body">
    <div class="login-wrapper">
      <!-- Kolom Kiri: Branding Teras JTI -->
      <aside class="login-brand">
        <div class="login-brand-inner">
          <div class="login-logo-box">
            <img
              src="assets/images/logo.png"
              alt="Logo Teras JTI"
              class="login-logo-img"
            />
          </div>
          <h1 class="login-brand-title">Teras JTI</h1>
          <p class="login-brand-desc">
            Co-Working Space &amp; Pusat Kreativitas Jurusan Teknologi Informasi Politeknik Negeri Jember.
          </p>
          <div class="mt-4">
            <a href="index.html" class="text-white text-decoration-none fw-medium">
              &larr; Kembali ke Profil Utama
            </a>
          </div>
        </div>
      </aside>

      <!-- Kolom Kanan: Panel Form Login -->
      <main class="login-panel">
        <div class="login-box">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="login-heading m-0">Masuk</h2>
            <a href="index.html" class="text-muted text-decoration-none small">Beranda Profil</a>
          </div>

          <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small" role="alert">
            Email atau kata sandi tidak boleh kosong!
          </div>

          <form id="form-login" class="login-form" action="dashboard.html" method="get">
            <div class="form-group mb-3">
              <label for="email" class="form-label">Email Mahasiswa / Akun</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="nama@student.polije.ac.id"
                value="farrel@student.polije.ac.id"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label for="sandi" class="form-label">Kata Sandi</label>
              <input
                type="password"
                id="sandi"
                name="sandi"
                class="form-input"
                placeholder="Masukkan kata sandi"
                value="rahasia123"
                required
              />
            </div>

            <button type="submit" class="btn-login">Masuk ke Sistem Reservasi</button>
          </form>

          <p class="login-footer-text">
            Belum punya akun?
            <a href="registrasi.html" class="login-link">Daftar Akun Baru</a>
          </p>

          <div class="text-center mt-3">
            <small class="text-muted">Simulasi Front-End &middot; NoBugNoCry 2026</small>
          </div>
        </div>
      </main>
    </div>

    <!-- Bootstrap 5 JS Bundle & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
