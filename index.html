<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Teras JTI</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components/button.css" />
    <link rel="stylesheet" href="assets/css/components/card.css" />
    <link rel="stylesheet" href="assets/css/components/form.css" />
    <link rel="stylesheet" href="assets/css/components/status.css" />
    <link rel="stylesheet" href="assets/css/components/table.css" />
  </head>
  <body class="login-body">
    <div class="login-wrapper">
      <!-- Kolom Kiri -->
      <aside class="login-brand">
        <div class="login-brand-inner">
          <div class="login-logo-box">
            <img
              src="assets/images/logo.png"
              alt="Logo Teras JTI"
              class="login-logo-img"
            />
          </div>
          <h1 class="login-brand-title">Teras JTI</h1>
          <p class="login-brand-desc">
            Reservasi tempat Jurusan Teknologi Informasi, dari mana saja.
          </p>
        </div>
      </aside>

      <!-- Kolom Kanan -->
      <main class="login-panel">
        <div class="login-box">
          <h2 class="login-heading">Masuk</h2>

          <form class="login-form" action="dashboard.html" method="get">
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="nama@email.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="sandi" class="form-label">Kata Sandi</label>
              <input
                type="password"
                id="sandi"
                name="sandi"
                class="form-input"
                placeholder="Masukkan kata sandi"
                required
              />
            </div>

            <button type="submit" class="btn-login">Login</button>
          </form>

          <p class="login-footer-text">
            Belum punya akun?
            <a href="registrasi.html" class="login-link">Daftar</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
